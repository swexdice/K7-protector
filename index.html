<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultra Fast 100k Virtualized Chat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(107, 114, 128, 0.8);
    }
    /* Touch momentum scroll support */
    .overflow-y-auto {
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans h-screen flex flex-col overflow-hidden antialiased select-none sm:select-auto">

  <!-- TOP APP HEADER / BAR -->
  <header class="h-14 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 z-20 shrink-0">
    <div class="flex items-center gap-3">
      <button id="mobileMenuBtn" class="md:hidden p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-sm shadow-sm shadow-brand-500/30">
          100k
        </div>
        <div>
          <h1 class="font-bold text-sm sm:text-base leading-tight">Virtual Chat Hub</h1>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 hidden sm:block">DOM Windowing ile 100.000 Mesaj Performansı</p>
        </div>
      </div>
    </div>

    <!-- Live Stats Bar (Header Compact View) -->
    <div class="hidden lg:flex items-center gap-4 text-xs font-mono bg-slate-100 dark:bg-slate-800/60 px-3 py-1.5 rounded-full border border-slate-200 dark:border-slate-700/50">
      <div class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-slate-500 dark:text-slate-400">FPS:</span>
        <span id="fpsMeter" class="font-bold text-emerald-600 dark:text-emerald-400">60</span>
      </div>
      <div class="h-3 w-px bg-slate-300 dark:bg-slate-700"></div>
      <div>
        <span class="text-slate-500 dark:text-slate-400">Toplam:</span>
        <span id="statTotalMsg" class="font-bold">100,000</span>
      </div>
      <div class="h-3 w-px bg-slate-300 dark:bg-slate-700"></div>
      <div>
        <span class="text-slate-500 dark:text-slate-400">DOM Düğümleri:</span>
        <span id="statDomNodes" class="font-bold text-brand-600 dark:text-brand-400">25</span>
      </div>
      <div class="h-3 w-px bg-slate-300 dark:bg-slate-700"></div>
      <div>
        <span class="text-slate-500 dark:text-slate-400">Aralık:</span>
        <span id="statRange" class="font-bold">#0 - #25</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-2">
      <button id="addMsgBtn" title="Simüle Mesaj Ekle" class="flex items-center gap-1.5 text-xs font-medium bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg transition-colors shadow-sm">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Canlı Mesaj</span>
      </button>
      <button id="themeToggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
      </button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- SIDEBAR (Desktop permanent, Mobile overlay drawer) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out md:static flex flex-col h-full shadow-2xl md:shadow-none">
      
      <!-- Drawer Header (Mobile Only) -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center md:hidden">
        <h2 class="font-bold text-slate-800 dark:text-slate-100">Filtreler & Kontroller</h2>
        <button id="closeDrawerBtn" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-4 space-y-5 overflow-y-auto flex-1">
        
        <!-- Search Box -->
        <div>
          <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-2">Arama (100k İçinde)</label>
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Mesaj veya içerik ara..." 
                   class="w-full pl-9 pr-8 py-2 text-sm bg-slate-100 dark:bg-slate-800 border-0 rounded-xl focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100 placeholder-slate-400 transition-all outline-none">
            <button id="clearSearchBtn" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
              <i data-lucide="x-circle" class="w-4 h-4"></i>
            </button>
          </div>
          <p id="searchCount" class="text-[11px] text-brand-600 dark:text-brand-400 mt-1 font-medium hidden">0 sonuç bulundu</p>
        </div>

        <!-- Jump to Index / ID -->
        <div>
          <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-2">Mesaj ID'sine Git (#)</label>
          <div class="flex gap-2">
            <input type="number" id="jumpInput" min="1" max="100000" placeholder="Örn: 50000" 
                   class="flex-1 px-3 py-2 text-sm bg-slate-100 dark:bg-slate-800 border-0 rounded-xl focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100 placeholder-slate-400 outline-none">
            <button id="jumpBtn" class="px-4 py-2 bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white rounded-xl text-xs font-medium transition-colors">
              Git
            </button>
          </div>
          <div class="flex justify-between gap-2 mt-2">
            <button id="jumpTopBtn" class="flex-1 py-1.5 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300 font-medium transition-colors flex items-center justify-center gap-1">
              <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i> En Üst (#1)
            </button>
            <button id="jumpBottomBtn" class="flex-1 py-1.5 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300 font-medium transition-colors flex items-center justify-center gap-1">
              <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i> En Alt (Son)
            </button>
          </div>
        </div>

        <!-- Sender Filter -->
        <div>
          <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-2">Gönderici Filtresi</label>
          <div id="senderFilterGroup" class="space-y-1">
            <button data-sender="all" class="filter-btn active w-full flex items-center justify-between px-3 py-2 text-xs rounded-xl font-medium bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-800">
              <span>Tüm Göndericiler</span>
              <span id="count-all" class="text-[10px] opacity-75 font-mono">100,000</span>
            </button>
            <button data-sender="Sistem" class="filter-btn w-full flex items-center justify-between px-3 py-2 text-xs rounded-xl font-medium hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-slate-400"></span> Sistem</span>
              <span id="count-sistem" class="text-[10px] text-slate-400 font-mono">--</span>
            </button>
            <button data-sender="Ahmet Yılmaz" class="filter-btn w-full flex items-center justify-between px-3 py-2 text-xs rounded-xl font-medium hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-500"></span> Ahmet Yılmaz</span>
              <span id="count-ahmet" class="text-[10px] text-slate-400 font-mono">--</span>
            </button>
            <button data-sender="Ayşe Kaya" class="filter-btn w-full flex items-center justify-between px-3 py-2 text-xs rounded-xl font-medium hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Ayşe Kaya</span>
              <span id="count-ayse" class="text-[10px] text-slate-400 font-mono">--</span>
            </button>
            <button data-sender="AI Asistan" class="filter-btn w-full flex items-center justify-between px-3 py-2 text-xs rounded-xl font-medium hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-purple-500"></span> AI Asistan</span>
              <span id="count-ai" class="text-[10px] text-slate-400 font-mono">--</span>
            </button>
            <button data-sender="Destek Ekibi" class="filter-btn w-full flex items-center justify-between px-3 py-2 text-xs rounded-xl font-medium hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-500"></span> Destek Ekibi</span>
              <span id="count-destek" class="text-[10px] text-slate-400 font-mono">--</span>
            </button>
          </div>
        </div>

        <!-- Status Filter -->
        <div>
          <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-2">Durum Filtresi</label>
          <div class="grid grid-cols-2 gap-2">
            <button id="flaggedFilterBtn" class="px-3 py-2 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-amber-50 dark:hover:bg-amber-950/30 text-slate-600 dark:text-slate-300 rounded-xl font-medium transition-colors flex items-center justify-center gap-1.5 border border-transparent">
              <i data-lucide="flag" class="w-3.5 h-3.5 text-amber-500"></i> İşaretliler
            </button>
            <button id="pinnedFilterBtn" class="px-3 py-2 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-blue-950/30 text-slate-600 dark:text-slate-300 rounded-xl font-medium transition-colors flex items-center justify-center gap-1.5 border border-transparent">
              <i data-lucide="pin" class="w-3.5 h-3.5 text-blue-500"></i> İğnelenenler
            </button>
          </div>
        </div>

        <!-- Mobile Performance Stats Panel -->
        <div class="lg:hidden p-3 bg-slate-100 dark:bg-slate-800/60 rounded-xl space-y-2 text-xs font-mono border border-slate-200 dark:border-slate-700/50">
          <div class="font-sans font-bold text-slate-700 dark:text-slate-200 mb-1">Performans İstatistikleri</div>
          <div class="flex justify-between">
            <span class="text-slate-500">FPS:</span>
            <span id="mobileFps" class="font-bold text-emerald-500">60</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-500">DOM Düğüm Sayısı:</span>
            <span id="mobileDomNodes" class="font-bold text-brand-500">0</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-500">Render Aralığı:</span>
            <span id="mobileRange" class="font-bold">#0 - #0</span>
          </div>
        </div>

      </div>

      <!-- Footer Info -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400 text-center">
        Virtual Scroll Windowing v2.0
      </div>
    </aside>

    <!-- Drawer Backdrop (Mobile) -->
    <div id="drawerBackdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-20 hidden md:hidden"></div>

    <!-- MAIN CHAT CONTAINER -->
    <main class="flex-1 flex flex-col h-full bg-slate-100/60 dark:bg-slate-950/40 relative">
      
      <!-- Quick Scroll Floating Button -->
      <button id="scrollToBottomFab" class="hidden absolute right-6 bottom-6 z-10 p-3 bg-brand-600 text-white rounded-full shadow-lg hover:bg-brand-700 transition-all transform hover:scale-105 active:scale-95">
        <i data-lucide="chevron-down" class="w-5 h-5"></i>
      </button>

      <!-- VIRTUAL SCROLLPORT CONTAINER -->
      <div id="scrollPort" class="flex-1 overflow-y-auto relative px-3 sm:px-6 py-4">
        <!-- Spacer element that maintains real 100k scrollbar height -->
        <div id="virtualSpacer" class="w-full relative">
          <!-- Rendered items container dynamically positioned inside spacer -->
          <div id="virtualContent" class="absolute left-0 right-0 top-0 space-y-3">
            <!-- Dynamic Message Nodes inserted here -->
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed top-16 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- SCRIPT LOGIC -->
  <script>
    // --- 1. DATA GENERATION & GLOBAL STATE ---
    const TOTAL_MESSAGES = 100000;
    const ITEM_ESTIMATED_HEIGHT = 110; // Estimated pixel height per message card
    const BUFFER_COUNT = 8; // Extra items above & below viewport

    const SENDERS = [
      { name: 'Ahmet Yılmaz', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop&crop=faces', role: 'Kullanıcı', color: 'border-blue-500' },
      { name: 'Ayşe Kaya', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop&crop=faces', role: 'Kullanıcı', color: 'border-emerald-500' },
      { name: 'AI Asistan', avatar: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&h=100&fit=crop&crop=faces', role: 'Bot', color: 'border-purple-500' },
      { name: 'Destek Ekibi', avatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&h=100&fit=crop&crop=faces', role: 'Temsilci', color: 'border-amber-500' },
      { name: 'Sistem', avatar: null, role: 'Sistem', color: 'border-slate-400' }
    ];

    const SAMPLE_TEXTS = [
      "Merhaba, 100.000 mesajlık sanal liste performans testine hoş geldiniz!",
      "Bu sistem DOM windowing kullanarak sadece görünür mesajları işler.",
      "Mobil cihazlarda kasma olmadan saniyede 60 kare kaydırma imkanı tanır.",
      "Sistem sunucusu güncellendi ve tüm veriler senkronize edildi.",
      "Arama çubuğunu kullanarak 100 bin kayıt arasında anlık filtreleme yapabilirsiniz.",
      "Mesaj ID'sine git kısmına istediğiniz sayıyı yazıp Enter'a basabilirsiniz.",
      "Geliştirici modunda bellek kullanımı oldukça düşük seviyede kalacaktır.",
      "Herhangi bir kilitlenme veya yavaşlama olmadan anında alta kaydırabilirsiniz.",
      "İşaretle (Flag) veya İğnele (Pin) düğmelerini deneyebilirsiniz."
    ];

    // Master dataset array
    let allMessages = [];
    // Currently visible/filtered dataset index mapping
    let filteredIndices = [];
    
    // User Interaction States
    const flaggedIds = new Set();
    const pinnedIds = new Set();
    let currentSenderFilter = 'all';
    let currentSearchTerm = '';
    let isFlaggedOnly = false;
    let isPinnedOnly = false;

    // Measured element heights cache to handle variable message heights
    const heightCache = new Map();

    // --- 2. DATA INITIALIZATION ---
    function generateInitialData() {
      console.time('Generate 100k Messages');
      const now = Date.now();
      
      const counts = { 'Ahmet Yılmaz': 0, 'Ayşe Kaya': 0, 'AI Asistan': 0, 'Destek Ekibi': 0, 'Sistem': 0 };

      for (let i = 0; i < TOTAL_MESSAGES; i++) {
        const id = i + 1;
        const sender = SENDERS[i % SENDERS.length];
        const textSnippet = SAMPLE_TEXTS[i % SAMPLE_TEXTS.length];
        const hasAttachment = (i % 17 === 0);
        
        counts[sender.name]++;

        allMessages.push({
          id: id,
          sender: sender,
          text: `[#${id}] ${textSnippet}`,
          timestamp: new Date(now - (TOTAL_MESSAGES - i) * 60000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          hasAttachment: hasAttachment
        });
      }

      // Initial filtered indices array includes all messages
      filteredIndices = Array.from({ length: TOTAL_MESSAGES }, (_, i) => i);
      console.timeEnd('Generate 100k Messages');

      // Update sidebar counts
      document.getElementById('count-all').innerText = TOTAL_MESSAGES.toLocaleString();
      document.getElementById('count-sistem').innerText = counts['Sistem'].toLocaleString();
      document.getElementById('count-ahmet').innerText = counts['Ahmet Yılmaz'].toLocaleString();
      document.getElementById('count-ayse').innerText = counts['Ayşe Kaya'].toLocaleString();
      document.getElementById('count-ai').innerText = counts['AI Asistan'].toLocaleString();
      document.getElementById('count-destek').innerText = counts['Destek Ekibi'].toLocaleString();
    }

    // --- 3. VIRTUAL SCROLLING ENGINE ---
    const scrollPort = document.getElementById('scrollPort');
    const virtualSpacer = document.getElementById('virtualSpacer');
    const virtualContent = document.getElementById('virtualContent');

    let visibleStart = 0;
    let visibleEnd = 0;

    // Helper to get cached item height or estimated height
    function getItemHeight(index) {
      return heightCache.get(index) || ITEM_ESTIMATED_HEIGHT;
    }

    // Calculate total height of filtered items
    function getTotalVirtualHeight() {
      let total = 0;
      for (let i = 0; i < filteredIndices.length; i++) {
        total += getItemHeight(i);
      }
      return total;
    }

    // Binary search to find start index for a given scrollTop
    function findStartIndex(scrollTop) {
      let currentOffset = 0;
      for (let i = 0; i < filteredIndices.length; i++) {
        const h = getItemHeight(i);
        if (currentOffset + h > scrollTop) {
          return i;
        }
        currentOffset += h;
      }
      return 0;
    }

    // Calculate top offset position for a specific virtual index
    function getItemTopOffset(targetIndex) {
      let offset = 0;
      const limit = Math.min(targetIndex, filteredIndices.length);
      for (let i = 0; i < limit; i++) {
        offset += getItemHeight(i);
      }
      return
